name: Drivo Outbox MongoDB Redis Integration

# Manual-only until the project owner explicitly approves automatic CI triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drivo-outbox-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  outbox-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
      DRIVO_CI_INTEGRATION: 'YES_I_AM_USING_EPHEMERAL_DB'
      DATABASE_URL: mongodb://127.0.0.1:27017/drivo_ci_outbox?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --no-audit --no-fund

      - name: Start ephemeral MongoDB and Redis (loopback only)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name drivo-ci-mongo \
            -p 127.0.0.1:27017:27017 \
            mongo:7.0 mongod --replSet rs0 --bind_ip_all
          docker run --rm -d --name drivo-ci-redis \
            -p 127.0.0.1:6379:6379 \
            redis:7.4-alpine redis-server --save '' --appendonly no

          for i in $(seq 1 45); do
            if docker exec drivo-ci-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -qx 1; then break; fi
            sleep 2
          done
          docker exec drivo-ci-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 45); do
            if docker exec drivo-ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx true; then break; fi
            sleep 2
          done
          docker exec drivo-ci-mongo mongosh --quiet --eval \
            'if (!db.hello().isWritablePrimary) quit(1)'
          docker exec drivo-ci-redis redis-cli ping | grep -qx PONG

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create schema and unique indexes in ephemeral database
        run: npx prisma db push --skip-generate

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Run existing isolated runtime regression tests
        run: |
          node scripts/phase3d-check.cjs
          node scripts/scheduled-driver-runtime-check.cjs

      - name: Test real MongoDB/Redis relay and missing-job recovery
        run: npx tsx scripts/outbox-live-integration.ts

      - name: Show container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker ps -a || true
          docker logs --tail 100 drivo-ci-mongo 2>&1 || true
          docker logs --tail 100 drivo-ci-redis 2>&1 || true

      - name: Destroy test services
        if: always()
        shell: bash
        run: |
          docker rm -f drivo-ci-mongo drivo-ci-redis 2>/dev/null || true
