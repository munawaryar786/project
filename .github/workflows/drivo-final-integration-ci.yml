name: Drivo Final Integration - Isolated Build and Tests

# Dedicated integration branch only. This workflow MUST NOT deploy or connect to live providers.
on:
  push:
    branches:
      - drivo-final-integration-20261025
  pull_request:
    branches:
      - fix-admin-driver-vehicle-dashboard

permissions:
  contents: read

concurrency:
  group: drivo-final-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == 'munawaryar786/project' &&
       github.head_ref == 'drivo-final-integration-20261025')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: mongodb://127.0.0.1:1/drivo_final_ci_no_database
      APP_ORIGIN: https://ci.drivo.invalid
      NEXT_PUBLIC_SITE_URL: https://ci.drivo.invalid
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-key-do-not-use
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout branch without stored git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Phase 3L verifies introduction commits; shallow clones give false positives

      - name: Configure Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Generate disposable CI-only signing material
        shell: bash
        run: |
          set -euo pipefail
          auth="$(openssl rand -hex 48)"
          csrf="$(openssl rand -hex 48)"
          echo "::add-mask::$auth"
          echo "::add-mask::$csrf"
          printf 'AUTH_SIGNING_SECRET=%s\nCSRF_HMAC_SECRET=%s\n' "$auth" "$csrf" >> "$GITHUB_ENV"

      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts --include=optional --no-audit --no-fund

      - name: Generate Prisma client and validate schema (no database connection)
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prisma generate --schema=prisma/schema.prisma
          ./node_modules/.bin/prisma validate --schema=prisma/schema.prisma

      - name: TypeScript and lint
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --noEmit --incremental false --pretty false
          npm run lint

      # Continue through all offline suites so one stale assertion cannot conceal other failures.
      # This is diagnostics only: the final step fails the job unless every gate passes.
      - name: Offline regression suites (no live MongoDB, Redis, payments, or SMS)
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          failed=0
          for suite in security:phase3a test:saved-routes test:dispatch test:phase3b test:phase3c test:phase3d test:phase3e test:phase3f test:phase3g test:phase3h test:phase3i test:phase3j test:phase3l; do
            echo "::group::$suite"
            if npm run "$suite"; then
              echo "PASS $suite" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL $suite" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Next.js production build with nonfunctional CI configuration
        id: build
        continue-on-error: true
        run: npm run build

      - name: Enforce regression and production-build gates
        if: ${{ always() }}
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regressions.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "Regression suites: $REGRESSION_OUTCOME"
          echo "Next.js build: $BUILD_OUTCOME"
          test "$REGRESSION_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
