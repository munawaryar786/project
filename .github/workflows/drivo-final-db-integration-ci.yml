name: Drivo Final Integration - Sealed MongoDB Redis

# CI-only disposable replica set, Redis and BullMQ. Never deploys.
# This workflow intentionally does NOT invoke the existing manual production operations.
on:
  push:
    branches:
      - drivo-final-integration-20261025
    paths:
      - '.github/workflows/drivo-final-db-integration-ci.yml'
      - 'scripts/phase2-ci-run.sh'
      - 'scripts/phase2-activation-live-integration.ts'
      - 'scripts/phase2-activation-worker.ts'
      - 'scripts/outbox-live-integration.ts'
      - 'scripts/phase2-payment-check.ts'
      - 'scripts/phase2-ci-isolation-check.ts'
      - 'prisma/schema.prisma'
      - 'lib/**'
      - 'app/api/**'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: drivo-final-db-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-mongo-redis:
    if: github.repository == 'munawaryar786/project' && github.ref == 'refs/heads/drivo-final-integration-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout source without persisting Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and generate Prisma client (no DB connection)
        env:
          DATABASE_URL: mongodb://127.0.0.1:1/drivo_disposable_ci_client_only
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          ./node_modules/.bin/prisma generate --schema=prisma/schema.prisma

      - name: Verify disposable-container isolation guards
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          test -z "${REDIS_URL:-}"
          test ! -f .env
          test ! -f .env.local
          grep -Fq -- '--internal "$network"' scripts/phase2-ci-run.sh
          grep -Fq -- 'DRIVO_CI_INTEGRATION=YES_I_AM_USING_EPHEMERAL_DB' scripts/phase2-ci-run.sh

      - name: Run sealed replica set, Redis, relay, payment and activation integration
        shell: bash
        run: bash scripts/phase2-ci-run.sh

      - name: Show only disposable container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker logs --tail 60 "drivo-phase2-mongo-${suffix}" 2>&1 || true
          docker logs --tail 60 "drivo-phase2-redis-${suffix}" 2>&1 || true

      - name: Destroy any remaining run-owned disposable Docker resources
        if: always()
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "drivo-phase2-redis-${suffix}" "drivo-phase2-mongo-${suffix}" 2>/dev/null || true
          docker network rm "drivo-phase2-ci-${suffix}" 2>/dev/null || true
