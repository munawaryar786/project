name: Drivo Production Build Artifact (NO DEPLOY)

# The workflow file currently lives only on the integration branch, so GitHub
# may not show 'Run workflow' until it is also present on the default branch.
# Updates to this file still trigger an automatic push build on this branch.
# Builds only the release package. No SSH, database connectivity, live API calls,
# payment credentials, production environment files, or PM2 changes.
on:
  push:
    branches:
      - drivo-final-integration-20261025
    paths:
      - '.github/workflows/drivo-production-artifact.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'prisma/schema.prisma'
      - 'public/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drivo-prod-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifact:
    if: github.repository == 'munawaryar786/project' && github.ref == 'refs/heads/drivo-final-integration-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      # Prisma generate / Next build do not need access to production MongoDB.
      DATABASE_URL: mongodb://127.0.0.1:1/drivo_release_build_no_database
      APP_ORIGIN: ${{ vars.DRIVO_PRODUCTION_ORIGIN }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.DRIVO_PRODUCTION_ORIGIN }}
      # Client-side Maps key is public in the finished JS. Restrict its
      # Google Cloud HTTP referrers and never use a server-side private key here.
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout immutable source without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Require release configuration without exposing values
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}" ]]; then
            echo "::error::Configure Actions secret NEXT_PUBLIC_GOOGLE_MAPS_API_KEY (browser-restricted public Maps key) before building."
            exit 1
          fi
          if [[ ! "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" =~ ^AIza[A-Za-z0-9_-]{30,}$ ]]; then
            echo "::error::The public Maps key format is invalid."
            exit 1
          fi
          if [[ ! "${APP_ORIGIN:-}" =~ ^https://[a-zA-Z0-9.-]+$ ]] || [[ "$APP_ORIGIN" != "$NEXT_PUBLIC_SITE_URL" ]]; then
            echo "::error::Configure Actions variable DRIVO_PRODUCTION_ORIGIN as the actual https://host without a trailing slash."
            exit 1
          fi
          test ! -e .env && test ! -e .env.local
          test ! -e .env.production && test ! -e .env.production.local

      - name: Generate ephemeral build-only signing material
        shell: bash
        run: |
          set -euo pipefail
          auth="$(openssl rand -hex 48)"
          csrf="$(openssl rand -hex 48)"
          echo "::add-mask::$auth"
          echo "::add-mask::$csrf"
          printf 'AUTH_SIGNING_SECRET=%s\nCSRF_HMAC_SECRET=%s\n' "$auth" "$csrf" >> "$GITHUB_ENV"

      - name: Install pinned dependencies and generate Prisma client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          ./node_modules/.bin/prisma generate --schema=prisma/schema.prisma

      - name: Compile deployable Next.js production assets
        run: npm run build

      - name: Archive only compiled assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          pkg="drivo-next-build-${GITHUB_SHA:0:12}.tar.gz"
          test -f .next/BUILD_ID
          tar -czf "$pkg" --exclude='.next/cache' .next
          sha256sum "$pkg" > "${pkg}.sha256"
          printf 'Git commit: %s\nNext build ID: %s\nPublic origin configured: yes\nPublic Maps key configured: yes\nIncludes credentials: no\nDeployment performed: no\n' "$GITHUB_SHA" "$(cat .next/BUILD_ID)" > "${pkg}.manifest.txt"

      - name: Upload authenticated short-lived build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drivo-next-build-${{ github.sha }}
          path: |
            drivo-next-build-*.tar.gz
            drivo-next-build-*.sha256
            drivo-next-build-*.manifest.txt
          if-no-files-found: error
          retention-days: 7
